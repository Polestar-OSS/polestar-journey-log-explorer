name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"

      - name: Install
        run: make install

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Build
        run: make build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: app/dist
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"

      - name: Install
        run: make install

      - name: Audit dependencies
        run: make audit
