name: Deploy to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Vite 7 requires Node 20.19+ or 22.12+
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"

      - name: Install dependencies
        run: make install

      - name: Lint and test
        run: make lint test

      - name: Build
        run: make build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./app/dist

  deploy:
    # No `environment:` block on purpose. Releases deploy from a tag, and the
    # auto-created github-pages environment only allows branches, so declaring
    # it rejects every release ("Tag ... is not allowed to deploy"). deploy-pages
    # still records the deployment against github-pages through the Pages API.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
